[project]
name = "mtah-possession"
version = "0.1.0"
description = "More than a Hack 2027: frame-level ball possession from automatic tracking data"
requires-python = ">=3.12,<3.13"
# Direct dependencies, pinned exactly. Every transitive package is pinned below through
# constraint-dependencies, so uv.lock reproduces requirements.lock.txt line for line.
# Keep the three in step: edit here, run `uv lock`, then `make lock` to refresh the txt file.
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "kloppy==3.18.0",
    "pytest==9.2.0",
]

[tool.uv]
# The repository is a set of scripts and modules run with `python -m`, not an installable package.
package = false
constraint-dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "cloudpickle==3.1.2",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.68.0",
    "frozenlist==1.8.0",
    "fsspec==2026.9.0",
    "idna==3.20",
    "iniconfig==2.3.1",
    "joblib==1.6.0",
    "kiwisolver==1.5.1",
    "lxml==6.1.3",
    "multidict==7.2.1",
    "narwhals==2.28.0",
    "packaging==26.3",
    "pillow==13.0.0",
    "pluggy==1.7.0",
    "propcache==0.5.4",
    "pygments==2.21.0",
    "pyparsing==3.3.3",
    "python-dateutil==4.0.0",
    "pytz==2026.6",
    "sortedcontainers==2.4.0",
    "threadpoolctl==3.8.0",
    "typing-extensions==4.16.0",
    "tzdata==2026.6",
    "yarl==1.25.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
